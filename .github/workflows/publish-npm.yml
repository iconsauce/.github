name: Publish Package on NPM
# Authentication uses npm trusted publishing (OIDC): no NPM_TOKEN secret.
# Every package calling this workflow must be registered on npmjs.com as a
# trusted publisher with its repository and the filename of the CALLING
# workflow (e.g. main.yml), since npm validates that one, not this reusable
# workflow.
on:
  workflow_call:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - name: Log
        run: |
          echo "github repository: ${{ github.repository }}"
        shell: bash
      - name: Checkout
        uses: actions/checkout@v6
      - name: Istantiate Node
        uses: iconsauce/.github/.github/actions/setup-node@main
      - name: Publish Package
        uses: iconsauce/.github/.github/actions/publish-npm@main
