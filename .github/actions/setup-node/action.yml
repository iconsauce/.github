name: Get Node and install deps
description: Sets the Node.js version and initializes core dependencies
inputs:
  package-manager-cache:
    description: 'Use of cache'
    required: false
    default: true
  node-version:
    description: 'Number of Octocats'
    required: false
    default: ''
  
runs:
  using: composite
  steps:
    - name: Log
      run: |
        echo "github repository: ${{ github.repository }}"
      shell: bash
    - uses: actions/checkout@v6
    - name: Log
      run: |
        echo "github repository: ${{ github.repository }}"
      shell: bash
    - name: Use Node Version from .nvmrc
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: '.nvmrc'
        cache: 'npm'
        package-manager-cache: ${{ inputs.package-manager-cache }}
    - name: Install Dependencies
      run: |
        npm install -g npm@latest
        npm ci
      shell: bash
    - name: Log
      run: |
        echo "node version: $(node --version)" 
        echo "npm version: $(npm --version)"
      shell: bash
      
