name: Publish to NPM
description: Publish the package to the NPM registry with npm trusted publishing (OIDC)

# No token: the npm CLI exchanges the GitHub Actions OIDC token for short-lived
# credentials and attaches provenance automatically. The calling job needs
# `id-token: write`, and the package must have the repository and the calling
# workflow file registered as trusted publisher on npmjs.com.
runs:
  using: 'composite'
  steps:
    - name: Publish to NPM
      run: npm publish --provenance --access public
      shell: bash
